<!doctype html>

<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI 프로젝트 통합 대시보드 - 동적 UI 목업</title>
  <style>
    :root {
      --bg: #f6f7f9;
      --panel: #ffffff;
      --panel-soft: #f0f4f8;
      --text: #16202a;
      --muted: #657384;
      --line: #d8e0ea;
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --green: #059669;
      --amber: #d97706;
      --red: #dc2626;
      --teal: #0f766e;
      --violet: #6d28d9;
      --shadow: 0 16px 40px rgba(22, 32, 42, 0.10);
      --radius: 8px;
    }


* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Arial, "Noto Sans KR", sans-serif;
  background: var(--bg);
  color: var(--text);
  letter-spacing: 0;
}

button, input, select, textarea {
  font: inherit;
}

button {
  border: 0;
  cursor: pointer;
}

.app {
  min-height: 100vh;
}

.hidden { display: none !important; }

.login-shell {
  min-height: 100vh;
  display: grid;
  grid-template-columns: minmax(320px, 0.9fr) minmax(560px, 1.1fr);
  background:
    linear-gradient(135deg, rgba(37, 99, 235, 0.12), transparent 36%),
    linear-gradient(315deg, rgba(15, 118, 110, 0.14), transparent 32%),
    var(--bg);
}

.login-brand {
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 48px;
  border-right: 1px solid var(--line);
  background: rgba(255, 255, 255, 0.58);
}

.brand-mark {
  display: inline-grid;
  place-items: center;
  width: 40px;
  height: 40px;
  border-radius: var(--radius);
  background: var(--text);
  color: #fff;
  font-weight: 800;
}

.login-brand h1 {
  margin: 28px 0 12px;
  font-size: 38px;
  line-height: 1.15;
  max-width: 420px;
}

.login-brand p {
  margin: 0;
  color: var(--muted);
  line-height: 1.7;
  max-width: 430px;
}

.journey-list {
  display: grid;
  gap: 12px;
  margin-top: 44px;
}

.journey-item {
  display: grid;
  grid-template-columns: 28px 1fr;
  gap: 12px;
  align-items: start;
  color: var(--muted);
  font-size: 14px;
}

.journey-num {
  width: 28px;
  height: 28px;
  border: 1px solid var(--line);
  border-radius: 50%;
  display: grid;
  place-items: center;
  color: var(--text);
  background: #fff;
  font-weight: 700;
  font-size: 12px;
}

.login-panel-wrap {
  display: grid;
  place-items: center;
  padding: 32px;
}

.login-panel {
  width: min(520px, 100%);
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 24px;
}

.tabs {
  display: grid;
  grid-template-columns: 1fr 1fr;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  overflow: hidden;
  margin-bottom: 20px;
}

.tab-btn {
  height: 44px;
  background: #fff;
  color: var(--muted);
  border-right: 1px solid var(--line);
  font-weight: 700;
}

.tab-btn:last-child { border-right: 0; }

.tab-btn.active {
  background: var(--text);
  color: #fff;
}

.field {
  display: grid;
  gap: 7px;
  margin-bottom: 14px;
}

.field label {
  font-size: 13px;
  color: var(--muted);
  font-weight: 700;
}

input, select, textarea {
  width: 100%;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: #fff;
  color: var(--text);
  padding: 11px 12px;
  outline: none;
}

input:focus, select:focus, textarea:focus {
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
}

textarea {
  min-height: 98px;
  resize: vertical;
  line-height: 1.55;
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 40px;
  padding: 10px 14px;
  border-radius: var(--radius);
  background: var(--text);
  color: #fff;
  font-weight: 800;
  white-space: nowrap;
}

.btn:hover { background: #0f1720; }

.btn.primary { background: var(--primary); }
.btn.primary:hover { background: var(--primary-dark); }
.btn.ghost {
  background: #fff;
  color: var(--text);
  border: 1px solid var(--line);
}
.btn.ghost:hover { background: var(--panel-soft); }
.btn.danger { background: var(--red); }
.btn.small {
  min-height: 32px;
  padding: 7px 10px;
  font-size: 13px;
}
.btn.icon {
  width: 36px;
  padding: 0;
  font-size: 17px;
}

.helper {
  color: var(--muted);
  font-size: 13px;
  line-height: 1.55;
}

.error-text {
  color: var(--red);
  font-size: 13px;
  min-height: 20px;
}

.shell {
  min-height: 100vh;
  display: grid;
  grid-template-columns: 260px 1fr;
}

.sidebar {
  background: #000064;
  color: #e5e7eb;
  padding: 22px 16px;
  display: flex;
  flex-direction: column;
  gap: 18px;
  min-width: 0;
}

.side-top {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 6px 14px;
  border-bottom: 1px solid rgba(255,255,255,0.12);
}

.side-top .brand-mark { background: #fff; color: #000064; }

.side-title {
  font-weight: 800;
  line-height: 1.25;
}

.side-sub {
  color: #9ca3af;
  font-size: 12px;
  margin-top: 3px;
}

.nav {
  display: grid;
  gap: 8px;
}

.nav-btn {
  min-height: 42px;
  display: flex;
  align-items: center;
  gap: 10px;
  text-align: left;
  padding: 10px 12px;
  border-radius: var(--radius);
  background: transparent;
  color: #cbd5e1;
  font-weight: 700;
}

.nav-btn:hover, .nav-btn.active {
  background: rgba(255,255,255,0.10);
  color: #fff;
}

.nav-btn.locked {
  opacity: 0.45;
  cursor: not-allowed;
}

.side-footer {
  margin-top: auto;
  padding: 12px;
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: var(--radius);
  color: #cbd5e1;
  font-size: 13px;
  line-height: 1.5;
}

.main {
  min-width: 0;
  display: grid;
  grid-template-rows: auto 1fr;
}

.topbar {
  min-height: 72px;
  padding: 14px 24px;
  background: rgba(255,255,255,0.86);
  border-bottom: 1px solid var(--line);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  position: sticky;
  top: 0;
  z-index: 5;
  backdrop-filter: blur(10px);
}

.topbar h2 {
  margin: 0;
  font-size: 20px;
}

.topbar p {
  margin: 4px 0 0;
  color: var(--muted);
  font-size: 13px;
}

.top-actions {
  display: flex;
  flex-wrap: wrap;
  justify-content: flex-end;
  gap: 8px;
}

.content {
  padding: 24px;
  min-width: 0;
}

.grid {
  display: grid;
  gap: 16px;
}

.stats {
  grid-template-columns: repeat(4, minmax(160px, 1fr));
}

.card {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: 0 8px 24px rgba(22,32,42,0.05);
  min-width: 0;
}

.card-pad { padding: 18px; }

.table-scroll { overflow-x: auto; }

.task-progress-list { display: grid; gap: 10px; }

.task-progress-card {
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 12px;
  background: #fff;
  display: grid;
  gap: 10px;
}

.task-progress-card.mine {
  border-color: rgba(37, 99, 235, 0.42);
  box-shadow: inset 3px 0 0 var(--primary);
}

.stat {
  display: grid;
  gap: 10px;
}

.stat-label {
  color: var(--muted);
  font-size: 13px;
  font-weight: 700;
}

.stat-value {
  font-size: 30px;
  font-weight: 900;
}

.stat-foot {
  color: var(--muted);
  font-size: 12px;
}

.toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin: 18px 0 12px;
}

.filters {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
}

.filters input,
.filters select {
  width: auto;
  min-width: 160px;
  height: 40px;
}

.section-title {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 12px;
}

.section-title h3 {
  margin: 0;
  font-size: 17px;
}

.section-title p {
  margin: 4px 0 0;
  color: var(--muted);
  font-size: 13px;
}

table {
  width: 100%;
  border-collapse: collapse;
  font-size: 14px;
}

th, td {
  padding: 12px;
  border-bottom: 1px solid var(--line);
  text-align: left;
  vertical-align: middle;
}

th {
  color: var(--muted);
  font-size: 12px;
  background: #f8fafc;
  white-space: nowrap;
}

tr:hover td { background: #fbfdff; }

.badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-height: 24px;
  padding: 3px 9px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 800;
  white-space: nowrap;
}

.badge.green { color: #065f46; background: #d1fae5; }
.badge.amber { color: #92400e; background: #fef3c7; }
.badge.red { color: #991b1b; background: #fee2e2; }
.badge.blue { color: #1e40af; background: #dbeafe; }
.badge.gray { color: #475569; background: #e2e8f0; }

.progress {
  height: 9px;
  background: #e5e7eb;
  border-radius: 999px;
  overflow: hidden;
  min-width: 92px;
}

.bar {
  height: 100%;
  border-radius: 999px;
  background: var(--primary);
}

.bar.green { background: var(--green); }
.bar.amber { background: var(--amber); }
.bar.red { background: var(--red); }

.progress-cell {
  display: grid;
  grid-template-columns: 1fr 42px;
  align-items: center;
  gap: 10px;
  min-width: 130px;
}

.two-col {
  grid-template-columns: minmax(320px, 0.85fr) minmax(520px, 1.15fr);
  align-items: start;
}

.dept-group {
  display: grid;
  gap: 10px;
  margin-bottom: 16px;
}

.dept-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  color: var(--muted);
  font-size: 13px;
  font-weight: 800;
}

.participant-card {
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 12px;
  background: #fff;
  display: grid;
  gap: 10px;
}

.participant-card.mine {
  border-color: rgba(37, 99, 235, 0.42);
  box-shadow: inset 3px 0 0 var(--primary);
}

.person-row {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 10px;
}

.person-name {
  font-weight: 900;
  margin-bottom: 3px;
}

.person-meta {
  color: var(--muted);
  font-size: 12px;
}

.detail-grid {
  grid-template-columns: minmax(0, 1fr) 360px;
  align-items: start;
}

.task-row {
  display: grid;
  grid-template-columns: minmax(130px, 1fr) minmax(140px, 200px) 44px 100px;
  gap: 10px;
  align-items: center;
  padding: 12px 0;
  border-bottom: 1px solid var(--line);
}

.task-row.selected {
  background: rgba(37, 99, 235, 0.04);
  border-radius: var(--radius);
  padding: 12px 8px;
}

.task-row:last-child { border-bottom: 0; }

input[type="range"] {
  padding: 0;
  accent-color: var(--primary);
}

.schedule-grid {
  grid-template-columns: repeat(3, 1fr);
}

.schedule-box {
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 12px;
  background: #fff;
}

.schedule-box strong {
  display: block;
  margin-bottom: 8px;
}

.date-row {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  color: var(--muted);
  font-size: 13px;
  margin: 5px 0;
}

.report-preview {
  display: grid;
  gap: 12px;
  max-height: 52vh;
  overflow: auto;
  padding-right: 4px;
}

.report-person {
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 12px;
  background: #fff;
}

.toast-wrap {
  position: fixed;
  right: 18px;
  bottom: 18px;
  display: grid;
  gap: 8px;
  z-index: 30;
}

.toast {
  background: #111827;
  color: #fff;
  border-radius: var(--radius);
  padding: 12px 14px;
  box-shadow: var(--shadow);
  max-width: 360px;
  line-height: 1.45;
  font-size: 14px;
}

.modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(15, 23, 42, 0.44);
  display: grid;
  place-items: center;
  padding: 20px;
  z-index: 20;
}

.modal {
  width: min(760px, 100%);
  max-height: 92vh;
  overflow: auto;
  background: var(--panel);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  border: 1px solid var(--line);
}

.modal-head, .modal-foot {
  padding: 16px 18px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  border-bottom: 1px solid var(--line);
}

.modal-foot {
  border-top: 1px solid var(--line);
  border-bottom: 0;
  justify-content: flex-end;
}

.modal-head h3 {
  margin: 0;
  font-size: 18px;
}

.modal-body {
  padding: 18px;
}

.empty {
  border: 1px dashed #b9c4d1;
  background: #f8fafc;
  color: var(--muted);
  border-radius: var(--radius);
  padding: 22px;
  text-align: center;
  line-height: 1.6;
}

.readonly {
  background: #f8fafc;
  color: #64748b;
}

@media (max-width: 980px) {
  .login-shell,
  .shell,
  .two-col,
  .detail-grid {
    grid-template-columns: 1fr;
  }

  .sidebar {
    position: static;
  }

  .stats,
  .schedule-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}

@media (max-width: 640px) {
  .login-brand,
  .login-panel-wrap,
  .content,
  .topbar {
    padding: 16px;
  }

  .topbar {
    align-items: stretch;
    flex-direction: column;
  }

  .stats,
  .schedule-grid {
    grid-template-columns: 1fr;
  }

  .task-row {
    grid-template-columns: 1fr;
  }

  .filters input,
  .filters select,
  .top-actions .btn {
    width: 100%;
  }
}


  </style>
</head>

    function uid(prefix) {
      return prefix + Math.random().toString(36).slice(2, 8);
    }

    function avgProgress(participant) {
      if (!participant || !participant.tasks || participant.tasks.length === 0) return 0;
      return Math.round(participant.tasks.reduce((sum, task) => sum + Number(task.progress || 0), 0) / participant.tasks.length);
    }

    function companyAvg(company) {
      if (!company.participants.length) return 0;
      return Math.round(company.participants.reduce((sum, p) => sum + avgProgress(p), 0) / company.participants.length);
    }

    function progressClass(value) {
      if (value >= 70) return "green";
      if (value >= 40) return "amber";
      return "red";
    }

    function statusBadge(status) {
      return status === "정체"
        ? '<span class="badge red">정체</span>'
        : '<span class="badge green">정상</span>';
    }

    function elapsedTarget(company) {
      if (!company.schedule || !company.schedule.startDate || !company.schedule.endDate) return 0;
      const start = new Date(company.schedule.startDate + "T00:00:00+09:00");
      const end = new Date(company.schedule.endDate + "T00:00:00+09:00");
      const total = Math.max(1, end - start);
      const elapsed = Math.min(Math.max(today - start, 0), total);
      return Math.round((elapsed / total) * 100);
    }

    function scheduleStatus(company, participant) {
      const target = elapsedTarget(company);
      const actual = avgProgress(participant);
      const diff = actual - target;
      if (diff >= 0) return { label: "양호", cls: "green", diff, target, actual };
      if (diff >= -15) return { label: "정상", cls: "amber", diff, target, actual };
      return { label: "정체", cls: "red", diff, target, actual };
    }

    function currentCompany() {
      return state.companies.find(c => c.id === state.selectedCompanyId) || state.companies[0];
    }

    function currentParticipant() {
      const company = currentCompany();
      return company?.participants.find(p => p.id === state.selectedParticipantId) || company?.participants[0] || null;
    }

    function ensureTaskFields(task) {
      if (!task) return null;
      task.weeklySummary ??= "";
      task.nextWeekPlan ??= "";
      task.instructorFeedback ??= "";
      task.reportCompleted ??= Boolean(task.weeklySummary.trim() || task.nextWeekPlan.trim());
      return task;
    }

    function currentTask() {
      const participant = currentParticipant();
      if (!participant || !participant.tasks.length) return null;
      const task = participant.tasks.find(t => t.id === state.selectedTaskId) || participant.tasks[0];
      state.selectedTaskId = task.id;
      return ensureTaskFields(task);
    }

    function taskRowsForCompany(company) {
      return company.participants.flatMap(participant => {
        if (!participant.tasks.length) return [{ company, participant, task: null }];
        return participant.tasks.map(task => ({ company, participant, task: ensureTaskFields(task) }));
      });
    }

    function allTaskRows() {
      return state.companies.flatMap(company => taskRowsForCompany(company));
    }

    function taskReportText(task, key, emptyText) {
      if (!task) return emptyText;
      return task[key]?.trim() || emptyText;
    }
    function isAdmin() {
      return state.auth?.role === "admin";
    }

    function isMine(participant) {
      return isAdmin() || participant?.id === state.auth?.participantId;
    }

    function allParticipants() {
      return state.companies.flatMap(company => company.participants.map(participant => ({ company, participant })));
    }

    function toast(message) {
      const el = document.createElement("div");
      el.className = "toast";
      el.textContent = message;
      toastWrap.appendChild(el);
      setTimeout(() => el.remove(), 3300);
    }

    function setView(view) {

      }
      state.view = view;

    }

    function closeModal() {

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    function renderProgress(value) {
      const cls = progressClass(value);
      return `
        <div class="progress-cell">
          <div class="progress"><div class="bar ${cls}" style="width:${value}%"></div></div>
          <strong>${value}%</strong>
        </div>
      `;
    }

                ${editable ? `
                  <select style="width:120px" data-action="change-status" data-participant="${participant.id}">
                    <option value="정상" ${participant.status === "정상" ? "selected" : ""}>정상</option>
                    <option value="정체" ${participant.status === "정체" ? "selected" : ""}>정체</option>
                  </select>
                ` : statusBadge(participant.status)}
              </div>
              <div class="grid stats" style="grid-template-columns: repeat(3, 1fr); margin-top:16px">
                ${renderStat("전체 진척도", avgProgress(participant) + "%", "과제 평균")}
                ${renderStat("목표 달성률", schedule.target + "%", "일정 기준")}
                ${renderStat("일정 상태", schedule.label, "실제-목표 " + schedule.diff + "%p")}
              </div>
            </div>

            <div class="card card-pad">
              <div class="section-title">
                <div>
                  <h3>과제 목록</h3>
                  <p>${editable ? "과제별 진척도 수정 및 주간보고 작성완료 여부를 확인할 수 있습니다." : "타 참여자의 과제는 읽기 전용입니다."}</p>
                </div>
                ${editable ? `<button class="btn ghost small" data-action="open-add-task" data-company="${company.id}" data-participant="${participant.id}">과제 추가</button>` : ""}
              </div>
              ${participant.tasks.length ? participant.tasks.map(item => {
                const t = ensureTaskFields(item);
                const isSelected = task?.id === t.id;
                const isCompleted = t.reportCompleted;
                return `
                  <div class="task-row ${isSelected ? "selected" : ""}">
                    <strong>${escapeHtml(t.name)}</strong>
                    <input type="range" min="0" max="100" value="${t.progress}" ${editable ? "" : "disabled"} data-action="task-progress" data-participant="${participant.id}" data-task="${t.id}" />
                    <strong>${t.progress}%</strong>
                    <button class="btn small ${isCompleted ? "ghost" : "primary"}" data-action="select-task" data-task="${t.id}" title="클릭 시 우측 주간보고 작성 폼으로 이동" style="${isCompleted ? "border-color:#059669; color:#059669; background:#d1fae5;" : ""}">
                      ${isCompleted ? "✓ 작성완료" : "미작성"}
                    </button>
                  </div>
                `;
              }).join("") : '<div class="empty">등록된 과제가 없습니다. 과제를 추가해 진척도를 관리하세요.</div>'}
            </div>
          </div>

          <aside class="grid">
            <div class="card card-pad">
              <div class="section-title">
                <div>
                  <h3>주간 보고</h3>
                  <p>과제를 선택한 뒤 과제별 금주 요약, 차주 계획, 강사 피드백을 관리합니다.</p>
                </div>
              </div>
              ${participant.tasks.length ? `
                <div class="field">
                  <label for="report-task">과제 선택</label>
                  <select id="report-task" data-action="change-report-task">${taskOptions}</select>
                </div>
                <div class="field">
                  <label>금주 요약</label>
                  <textarea id="weekly-summary" ${editable ? "" : "readonly class='readonly'"}>${escapeHtml(task?.weeklySummary || "")}</textarea>


            </div>
            <div class="field">
              <label>차주 계획</label>
              <textarea id="task-next-plan" ${editable ? "" : "readonly class='readonly'"}>${escapeHtml(task?.nextWeekPlan || "")}</textarea>
            </div>
            <div class="field">
              <label>강사 피드백</label>
              <textarea id="task-feedback" ${isAdmin() ? "" : "readonly class='readonly'"}>${escapeHtml(task?.instructorFeedback || "")}</textarea>
            </div>
            ${task?.instructorFeedback ? "" : '<p class="helper">선택한 과제에 등록된 강사 메모가 없습니다.</p>'}
            <p class="helper">마지막 저장 시각: 2026-08-03 14:20</p>
          ` : '<div class="empty">등록된 과제가 없습니다. 과제를 추가한 뒤 과제별 주간 보고를 작성하세요.</div>'}
        </div>
      </aside>
    </div>
  `;
}

function renderModal() {
  if (!state.modal) return "";
  const modalMap = {
    addCompany: renderAddCompanyModal,
    addParticipant: renderAddParticipantModal,
    addTask: renderAddTaskModal,
    schedule: renderScheduleModal,
    report: renderReportModal,
    deleteCompany: renderDeleteCompanyModal
  };
  return modalMap[state.modal]?.() || "";
}

function modalShell(title, body, foot) {
  return `
    <div class="modal-backdrop" data-action="close-modal">
      <div class="modal" data-stop="true">
        <div class="modal-head">
          <h3>${title}</h3>
          <button class="btn ghost icon" data-action="close-modal" title="닫기">×</button>
        </div>
        <div class="modal-body">${body}</div>
        <div class="modal-foot">${foot}</div>
      </div>
    </div>
  `;
}

function renderAddCompanyModal() {
  return modalShell("업체 추가", `
    <div class="field">
      <label for="company-name">업체명</label>
      <input id="company-name" placeholder="신규 업체명" />
    </div>
    <p class="helper">업체 추가 후 일정 편집에서 시작일과 종료일을 설정할 수 있습니다.</p>
  `, `
    <button class="btn ghost" data-action="close-modal">취소</button>
    <button class="btn primary" data-action="add-company">저장</button>
  `);
}

function renderAddParticipantModal() {
  return modalShell("참여자 등록", `
    <div class="field"><label>이름</label><input id="new-name" placeholder="참여자 이름" /></div>
    <div class="field"><label>이메일</label><input id="new-email" type="email" placeholder="name@example.com" /></div>
    <div class="field"><label>부서</label><input id="new-dept" placeholder="부서명" /></div>
  `, `
    <button class="btn ghost" data-action="close-modal">취소</button>
    <button class="btn primary" data-action="add-participant">등록</button>
  `);
}

function renderAddTaskModal() {
  const participant = state.form.participantId ? allParticipants().find(r => r.participant.id === state.form.participantId)?.participant : currentParticipant();
  return modalShell("과제 추가", `
    <p class="helper" style="margin-top:0">${escapeHtml(participant?.name || "선택 참여자")}에게 신규 과제를 추가합니다.</p>
    <div class="field"><label>과제명</label><input id="task-name" placeholder="예: 데이터 품질 점검" /></div>
  `, `
    <button class="btn ghost" data-action="close-modal">취소</button>
    <button class="btn primary" data-action="add-task">추가</button>
  `);
}

function renderScheduleModal() {
  const company = state.companies.find(c => c.id === state.form.companyId) || currentCompany();
  return modalShell("일정 편집", `
    <p class="helper" style="margin-top:0">${escapeHtml(company.name)}의 프로젝트 일정을 수정합니다.</p>
    <div class="field"><label>시작일</label><input id="schedule-start" type="date" value="${company.schedule?.startDate || ""}" /></div>
    <div class="field"><label>KickOff</label><input id="schedule-kickoff" type="date" value="${company.schedule?.kickoffDate || ""}" /></div>
    <div class="field"><label>종료일</label><input id="schedule-end" type="date" value="${company.schedule?.endDate || ""}" /></div>
  `, `
    <button class="btn ghost" data-action="close-modal">취소</button>
    <button class="btn primary" data-action="save-schedule">저장</button>
  `);
}

function renderReportModal() {
  const company = currentCompany();
  return modalShell("주간 레포트 발행", `
    <div class="grid" style="grid-template-columns: 1fr 1fr">
      <div class="field">
        <label>컨설팅 주차</label>
        <input value="32주차" readonly class="readonly" />
      </div>
      <div class="field">
        <label>업체</label>
        <input value="${escapeHtml(company.name)}" readonly class="readonly" />
      </div>
    </div>
    <div class="field">
      <label>주요 전달 내용</label>
      <textarea id="report-note">이번 주는 과제 진척도와 요약 누락 여부를 중심으로 점검했습니다.</textarea>
    </div>
    <div class="section-title">
      <div>
        <h3>과제별 미리보기</h3>
        <p>발행 전 참여자별 과제, 요약, 계획, 강사 메모를 확인합니다.</p>
      </div>
    </div>
    <div class="report-preview">
      ${company.participants.length ? company.participants.map(p => `
        <div class="report-person">
          <strong>${escapeHtml(p.name)} · ${escapeHtml(p.dept)}</strong>
          <p class="helper">평균 진척도 ${avgProgress(p)}% · 상태 ${p.status}</p>
          ${p.tasks.length ? p.tasks.map(task => `
            <div style="border-top:1px solid var(--line); padding-top:10px; margin-top:10px">
              <p><b>${escapeHtml(task.name)}</b> · 진척도 ${task.progress}%</p>
              <p><b>금주 요약</b><br />${escapeHtml(taskReportText(task, "weeklySummary", "금주 요약이 아직 작성되지 않았습니다."))}</p>
              <p><b>차주 계획</b><br />${escapeHtml(taskReportText(task, "nextWeekPlan", "차주 계획이 아직 작성되지 않았습니다."))}</p>
              <p><b>강사 메모</b><br />${escapeHtml(taskReportText(task, "instructorFeedback", "강사 메모가 아직 작성되지 않았습니다."))}</p>
            </div>
          `).join("") : '<p class="helper">등록된 과제가 없습니다.</p>'}
        </div>
      `).join("") : '<div class="empty">발행할 참여자 데이터가 없습니다.</div>'}
    </div>
  `, `
    <button class="btn ghost" data-action="close-modal">취소</button>
    <button class="btn primary" data-action="publish-report">스프레드시트 발행</button>
  `);
}

function renderDeleteCompanyModal() {
  const company = currentCompany();
  return modalShell("업체 삭제", `
    <p><strong>${escapeHtml(company.name)}</strong> 업체를 삭제하면 하위 참여자와 일정 데이터가 함께 사라집니다.</p>
    <div class="field">
      <label>삭제 확인</label>
      <input id="delete-confirm" placeholder="업체명을 입력하세요" />
    </div>
  `, `
    <button class="btn ghost" data-action="close-modal">취소</button>
    <button class="btn danger" data-action="delete-company">삭제</button>
  `);
}

function render() {
  if (!state.auth) renderLogin();
  else renderShell();
}

document.addEventListener("click", (event) => {
  const stop = event.target.closest("[data-stop]");
  if (stop) event.stopPropagation();
  const el = event.target.closest("[data-action]");
  if (!el) return;
  const action = el.dataset.action;

  if (action === "login-tab") {
    state.loginTab = el.dataset.tab;
    render();
  }

  if (action === "admin-login") {
    const password = document.getElementById("admin-password").value;
    if (password !== "admin1234") {
      document.getElementById("login-error").textContent = "비밀번호가 올바르지 않습니다.";
      return;
    }
    state.auth = { role: "admin", name: "관리자" };
    state.view = "admin";
    toast("관리자 모드로 로그인했습니다.");
    render();
  }

  if (action === "participant-login") {
    const companyId = document.getElementById("login-company").value;
    const name = document.getElementById("login-name").value.trim();
    const email = document.getElementById("login-email").value.trim().toLowerCase();
    const company = state.companies.find(c => c.id === companyId);
    const participant = company.participants.find(p => p.name === name && p.email.toLowerCase() === email);
    if (!participant) {
      document.getElementById("login-error").textContent = "등록된 정보가 없습니다. 부서를 입력해 신규 등록할 수 있습니다.";
      document.getElementById("new-dept-wrap").classList.remove("hidden");
      document.querySelector("[data-action='participant-register']").classList.remove("hidden");
      return;
    }
    state.auth = { role: "participant", name: participant.name, participantId: participant.id };
    state.selectedCompanyId = company.id;
    state.selectedParticipantId = participant.id;
    state.view = "company";
    toast("참여자 모드로 로그인했습니다.");
    render();
  }

  if (action === "participant-register") {
    const companyId = document.getElementById("login-company").value;
    const name = document.getElementById("login-name").value.trim();
    const email = document.getElementById("login-email").value.trim().toLowerCase();
    const dept = document.getElementById("login-dept").value.trim();
    if (!name || !email || !dept) {
      document.getElementById("login-error").textContent = "이름, 이메일, 부서를 모두 입력해 주세요.";
      return;
    }
    const company = state.companies.find(c => c.id === companyId);
    const participant = { id: uid("p"), name, email, dept, status: "정상", summary: "", nextWeekPlan: "", instructorMemo: "", tasks: [] };
    company.participants.push(participant);
    state.auth = { role: "participant", name, participantId: participant.id };
    state.selectedCompanyId = company.id;
    state.selectedParticipantId = participant.id;
    state.view = "personal";
    toast("신규 참여자로 등록했습니다.");
    render();
  }

  if (action === "logout") {
    state.auth = null;
    state.view = "login";
    toast("로그아웃했습니다.");
    render();
  }

  if (action === "nav") setView(el.dataset.view);
  if (action === "open-add-company") openModal("addCompany");
  if (action === "open-add-participant") openModal("addParticipant");
  if (action === "open-report") openModal("report");
  if (action === "close-modal") closeModal();
  if (action === "open-schedule") openModal("schedule", { companyId: el.dataset.company });
  if (action === "open-add-task") openModal("addTask", { companyId: el.dataset.company, participantId: el.dataset.participant });

  if (action === "select-task") {
    state.selectedTaskId = el.dataset.task;
    render();
  }

  if (action === "view-person") {
    state.selectedCompanyId = el.dataset.company;
    state.selectedParticipantId = el.dataset.participant;
    if (el.dataset.task) state.selectedTaskId = el.dataset.task;
    state.view = "personal";
    render();
  }

  if (action === "sync-participants") {
    toast("참여자 명단 업데이트 요청을 전송했습니다. 스프레드시트 반영 여부를 확인해 주세요.");
  }

  if (action === "publish-report") {
    closeModal();
    toast("레포트 발행 요청을 전송했습니다. 스프레드시트 반영 여부를 확인해 주세요.");
  }

  if (action === "save-personal") {
    const task = currentTask();
    if (!task) return toast("과제를 먼저 추가해 주세요.");
    task.weeklySummary = document.getElementById("weekly-summary")?.value || "";
    task.nextWeekPlan = document.getElementById("task-next-plan")?.value || "";
    task.reportCompleted = true;
    toast("선택한 과제의 주간 보고를 저장했으며 '작성완료'로 업데이트되었습니다.");
    render();
  }

  if (action === "save-feedback") {
    const task = currentTask();
    if (!task) return toast("과제를 먼저 추가해 주세요.");
    task.weeklySummary = document.getElementById("weekly-summary")?.value || task.weeklySummary || "";
    task.nextWeekPlan = document.getElementById("task-next-plan")?.value || task.nextWeekPlan || "";
    task.instructorFeedback = document.getElementById("task-feedback")?.value || "";
    toast("선택한 과제의 강사 피드백을 저장했습니다.");
    render();
  }

  if (action === "add-company") {
    const name = document.getElementById("company-name").value.trim();
    if (!name) return toast("업체명을 입력해 주세요.");
    const company = { id: uid("c"), name, schedule: { startDate: "2026-08-03", kickoffDate: "2026-08-05", endDate: "2026-09-30" }, participants: [] };
    state.companies.push(company);
    state.selectedCompanyId = company.id;
    closeModal();
    toast("업체를 추가했습니다.");
  }

  if (action === "add-participant") {
    const name = document.getElementById("new-name").value.trim();
    const email = document.getElementById("new-email").value.trim();
    const dept = document.getElementById("new-dept").value.trim();
    if (!name || !email || !dept) return toast("이름, 이메일, 부서를 모두 입력해 주세요.");
    currentCompany().participants.push({ id: uid("p"), name, email, dept, status: "정상", summary: "", nextWeekPlan: "", instructorMemo: "", tasks: [] });
    closeModal();
    toast("참여자를 등록했습니다.");
  }

  if (action === "add-task") {
    const taskName = document.getElementById("task-name").value.trim();
    if (!taskName) return toast("과제명을 입력해 주세요.");
    const company = state.companies.find(c => c.id === state.form.companyId) || currentCompany();
    const participant = company.participants.find(p => p.id === state.form.participantId) || currentParticipant();
    const task = { id: uid("t"), name: taskName, progress: 0, weeklySummary: "", nextWeekPlan: "", instructorFeedback: "", reportCompleted: false };
    participant.tasks.push(task);
    state.selectedTaskId = task.id;
    state.selectedCompanyId = company.id;
    state.selectedParticipantId = participant.id;
    closeModal();
    toast("과제를 추가했습니다.");
  }

  if (action === "save-schedule") {
    const company = state.companies.find(c => c.id === state.form.companyId);
    const startDate = document.getElementById("schedule-start").value;
    const kickoffDate = document.getElementById("schedule-kickoff").value;
    const endDate = document.getElementById("schedule-end").value;
    if (startDate && endDate && new Date(endDate) < new Date(startDate)) return toast("종료일은 시작일보다 늦어야 합니다.");
    company.schedule = { startDate, kickoffDate, endDate };
    closeModal();
    toast("업체 일정을 저장했습니다.");
  }
});

document.addEventListener("input", (event) => {
  const el = event.target.closest("[data-action]");
  if (!el) return;
  const action = el.dataset.action;

  if (action === "search") {
    state.search = el.value;
    render();
  }

  if (action === "task-progress") {
    const participant = currentParticipant();
    const task = participant.tasks.find(t => t.id === el.dataset.task);
    task.progress = Number(el.value);
    render();
    toast("진척도를 저장했습니다.");
  }
});

document.addEventListener("change", (event) => {
  const el = event.target.closest("[data-action]");
  if (!el) return;
  const action = el.dataset.action;

  if (action === "select-company") {
    state.selectedCompanyId = el.value;
    const company = currentCompany();
    if (company.participants[0]) state.selectedParticipantId = company.participants[0].id;
    render();
  }

  if (action === "change-report-task") {
    state.selectedTaskId = el.value;
    render();
  }

  if (action === "filter-status") {
    state.filterStatus = el.value;
    render();
  }

  if (action === "change-status") {
    currentParticipant().status = el.value;
    toast("상태를 변경했습니다.");
    render();
  }
});

render();


  </script>
</body>
</html>
